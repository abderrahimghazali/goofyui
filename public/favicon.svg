<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Goofy face background circle -->
  <circle cx="16" cy="16" r="14" fill="#FFD93D"/>

  <!-- Left eye (winking) -->
  <path d="M 8 12 Q 11 10 14 12" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Right eye (big and googly) -->
  <circle cx="20" cy="12" r="3.5" fill="#FFF"/>
  <circle cx="21" cy="12.5" r="2" fill="#000"/>
  <circle cx="21.5" cy="12" r="0.5" fill="#FFF"/>

  <!-- Goofy smile -->
  <path d="M 8 20 Q 16 26 24 20" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Tongue sticking out -->
  <ellipse cx="16" cy="23" rx="4" ry="3" fill="#FF6B9D"/>

  <!-- Single tooth -->
  <rect x="14" y="19" width="2" height="3" fill="#FFF" stroke="#000" stroke-width="0.5"/>
</svg>